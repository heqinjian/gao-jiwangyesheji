<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
        #box{
            width: 480px;
            padding: 8px;
            border: 1px solid purple;
            font-size: 12px;
            margin: 20px;
        }
        #box .student-id{
            color: blue;
            font-weight: bold;
        }
        #box .student-name{
            color: #333;
            font-weight: bold;
        }
        #box h3{
            font-size: 16px;
            text-align: center;
            line-height: 33px;
            /* 字间距3px */
            letter-spacing: 3px;
            color: #036;
        }
        #box p{
            line-height: 20px;
            color: #666;
            text-indent: 2em;
        }
        #box a{
            color: #036;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box"> 
        <h3>CSS那些事</h3>
        <p>
            <span class="student-id">学号：418</span>，<span class="student-name">姓名：何秦剑</span>，班级：计算机24004，对于《高级网页设计》课程的难度认知为：难，
            对于这个例子对应的知识点是：群组选择器、后代选择器、层叠与继承。
            <a href="#">更多>></a>
        </p>
    </div>
</body>
</html>
