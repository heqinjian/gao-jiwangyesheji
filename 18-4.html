<!DOCTYPE html>
<!-- 何秦剑  建立时间：2026-11-05  大模型：GPT-6-luna  功能：ECharts GL 3D 地球（真实感着色、地形凹凸、星空环境，库与贴图全部本地化） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 地球 | 18-4 何秦剑</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0d1117;
        color: #e6edf3;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .hqj-wrap { max-width: 1280px; margin: 0 auto; padding: 28px 16px 56px; }
    .hqj-header { text-align: center; margin-bottom: 22px; }
    .hqj-header h1 { font-size: 26px; margin-bottom: 8px; }
    .hqj-header h1 .hqj-hl { color: #58d68d; }
    .hqj-header p { color: #8b949e; font-size: 13.5px; }

    .hqj-chart-block {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 14px;
        padding: 18px 20px 22px;
    }
    .hqj-chart-block h2 {
        font-size: 17px; margin-bottom: 4px;
        display: flex; align-items: center; gap: 10px;
    }
    .hqj-chart-block h2 .hqj-badge {
        font-size: 11px; font-family: Consolas, monospace;
        padding: 2px 9px; border-radius: 10px;
        background: #1f6feb22; color: #58a6ff;
    }
    .hqj-chart-block > p { font-size: 12.5px; color: #8b949e; margin-bottom: 12px; }
    .hqj-chart { width: 100%; height: 640px; }

    .hqj-back {
        display: inline-block; margin-top: 18px;
        color: #8b949e; font-size: 13px; text-decoration: none;
    }
</style>
</head>
<body>
<div class="hqj-wrap">
    <header class="hqj-header">
        <h1>3D <span class="hqj-hl">地球</span></h1>
        <p>echarts-gl 真实感着色、地形凹凸贴图、星空环境与后期辉光，可拖拽旋转、滚轮缩放</p>
    </header>

    <div class="hqj-chart-block">
        <h2>3D 地球 <span class="hqj-badge">echarts-gl · globe</span></h2>
        <p>所有库与贴图均位于本地 cdn/echarts 目录，无外部 CDN 依赖</p>
        <div class="hqj-chart" id="hqj_globe"></div>
    </div>

    <a class="hqj-back" href="index.html">← 返回首页</a>
</div>

<script src="cdn/echarts/echarts.min.js"></script>
<script src="cdn/echarts/echarts-gl.min.js"></script>
<script>
(function () {
    var hqj_assetBase = 'cdn/echarts/';
    var hqj_globeChart = echarts.init(document.getElementById('hqj_globe'));

    hqj_globeChart.setOption({
        backgroundColor: '#000',
        globe: {
            baseTexture: hqj_assetBase + 'world.topo.bathy.200401.jpg',
            heightTexture: hqj_assetBase + 'world.topo.bathy.200401.jpg',
            displacementScale: 0.04,
            shading: 'realistic',
            environment: hqj_assetBase + 'starfield.jpg',
            realisticMaterial: { roughness: 0.9 },
            postEffect: { enable: true },
            light: {
                main: { intensity: 5, shadow: true },
                ambientCubemap: {
                    texture: hqj_assetBase + 'pisa.hdr',
                    diffuseIntensity: 0.2
                }
            }
        }
    });

    window.addEventListener('resize', function () {
        hqj_globeChart.resize();
    });
})();
</script>
</body>
</html>
