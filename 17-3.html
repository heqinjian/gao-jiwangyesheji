<!DOCTYPE html>
<!-- 何秦剑  建立时间：2026-11-01  大模型：GPT-6-luna  功能：商品列表页，fetch 跨域获取接口数据，点击进入详情页 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品列表 | 17-3 何秦剑</title>
<style>
    :root {
        --hqj-bg: #f3f5fa;
        --hqj-panel: #fff;
        --hqj-ink: #1f2738;
        --hqj-muted: #7c869e;
        --hqj-line: #e3e8f2;
        --hqj-accent: #0ea5e9;
        --hqj-red: #ef4444;
        --hqj-orange: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: var(--hqj-bg);
        color: var(--hqj-ink);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .hqj-wrap { max-width: 1080px; margin: 0 auto; padding: 30px 16px 60px; }
    .hqj-header {
        display: flex; align-items: flex-end; justify-content: space-between;
        flex-wrap: wrap; gap: 10px; margin-bottom: 20px;
    }
    .hqj-header h1 { font-size: 25px; }
    .hqj-header h1 .hqj-hl { color: var(--hqj-accent); }
    .hqj-api {
        font-family: Consolas, monospace; font-size: 12.5px;
        color: var(--hqj-accent);
    }

    .hqj-status { text-align: center; padding: 70px 0; color: var(--hqj-muted); }
    .hqj-spinner {
        width: 40px; height: 40px;
        border: 3px solid var(--hqj-line);
        border-top-color: var(--hqj-accent);
        border-radius: 50%;
        margin: 0 auto 14px;
        animation: hqj-spin 0.8s linear infinite;
    }
    @keyframes hqj-spin { to { transform: rotate(360deg); } }
    .hqj-error {
        background: #fef2f2; border: 1px solid #fecaca;
        color: var(--hqj-red); border-radius: 12px;
        padding: 20px; text-align: center;
    }
    .hqj-btn {
        margin-top: 12px;
        padding: 8px 20px; border: none; border-radius: 8px;
        background: var(--hqj-accent); color: #fff;
        font-size: 14px; font-family: inherit; cursor: pointer;
    }

    .hqj-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 16px;
    }
    .hqj-card {
        background: var(--hqj-panel);
        border: 1px solid var(--hqj-line);
        border-radius: 12px;
        overflow: hidden;
        display: block;
        color: inherit;
        transition: transform 0.15s, box-shadow 0.15s;
    }
    .hqj-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 24px rgba(0,0,0,0.1);
    }
    .hqj-thumb {
        height: 180px; background: #fafafa;
        display: flex; align-items: center; justify-content: center;
        padding: 14px;
    }
    .hqj-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .hqj-info { padding: 12px 14px 14px; }
    .hqj-title {
        font-size: 14px; font-weight: 700; margin-bottom: 8px;
        min-height: 44px;
        display: -webkit-box; -webkit-line-clamp: 2;
        -webkit-box-orient: vertical; overflow: hidden;
    }
    .hqj-meta {
        display: flex; align-items: center; justify-content: space-between;
    }
    .hqj-price { color: var(--hqj-red); font-weight: 700; font-size: 17px; }
    .hqj-rate { color: var(--hqj-orange); font-size: 12.5px; }
    .hqj-more {
        text-align: center; font-size: 13px; color: var(--hqj-accent);
        margin-top: 10px;
    }

    .hqj-back {
        display: inline-block; margin-top: 26px;
        color: var(--hqj-muted); font-size: 13px; text-decoration: none;
    }
</style>
</head>
<body>
<div class="hqj-wrap">
    <header class="hqj-header">
        <h1>商品 <span class="hqj-hl">列表</span></h1>
        <span class="hqj-api">GET https://dummyjson.com/products?limit=8</span>
    </header>

    <div id="hqj_content">
        <div class="hqj-status">
            <div class="hqj-spinner"></div>
            <p>正在加载商品列表…</p>
        </div>
    </div>

    <a class="hqj-back" href="index.html">← 返回首页</a>
</div>

<script>
(function () {
    var hqj_URL = 'https://dummyjson.com/products?limit=8';
    var hqj_content = document.getElementById('hqj_content');

    function hqj_showError(msg) {
        hqj_content.innerHTML =
            '<div class="hqj-error"><strong>请求失败：</strong>' + msg +
            '<br><button class="hqj-btn" onclick="location.reload()">重新加载</button></div>';
    }

    fetch(hqj_URL)
        .then(function (response) {
            if (!response.ok) throw new Error('HTTP 状态码 ' + response.status);
            return response.json();
        })
        .then(function (data) {
            var grid = document.createElement('div');
            grid.className = 'hqj-grid';

            data.products.forEach(function (p) {
                var a = document.createElement('a');
                a.className = 'hqj-card';
                a.href = '17-3-detail.html?id=' + p.id;
                a.innerHTML =
                    '<div class="hqj-thumb"><img src="' + p.thumbnail + '" alt="' + p.title + '"></div>' +
                    '<div class="hqj-info">' +
                    '<div class="hqj-title">' + p.title + '</div>' +
                    '<div class="hqj-meta">' +
                    '<span class="hqj-price">$' + p.price + '</span>' +
                    '<span class="hqj-rate">★ ' + p.rating + '</span>' +
                    '</div></div>';
                grid.appendChild(a);
            });

            hqj_content.innerHTML = '';
            hqj_content.appendChild(grid);

            var tip = document.createElement('p');
            tip.className = 'hqj-more';
            tip.textContent = '点击任意商品卡片，携带 id 跳转到详情页';
            hqj_content.appendChild(tip);
        })
        .catch(function (err) {
            hqj_showError(err.message);
        });
})();
</script>
</body>
</html>
