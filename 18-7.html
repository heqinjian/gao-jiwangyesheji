<!DOCTYPE html>
<!-- 何秦剑  建立时间：2026-11-05  大模型：GPT-6-luna  功能：基于本地 Three.js 实现两个 3D 图表——3D 柱状图与 3D 饼图（库文件位于 cdn/three） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js 3D 图表 | 18-7 何秦剑</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0d1117;
        color: #e6edf3;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .hqj-wrap { max-width: 1280px; margin: 0 auto; padding: 28px 16px 56px; }
    .hqj-header { text-align: center; margin-bottom: 22px; }
    .hqj-header h1 { font-size: 26px; margin-bottom: 8px; }
    .hqj-header h1 .hqj-hl { color: #38bdf8; }
    .hqj-header p { color: #8b949e; font-size: 13.5px; }

    .hqj-panel {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 14px;
        padding: 18px 20px 22px;
        margin-bottom: 20px;
    }
    .hqj-panel h2 {
        font-size: 17px; margin-bottom: 4px;
        display: flex; align-items: center; gap: 10px;
    }
    .hqj-panel h2 .hqj-badge {
        font-size: 11px; font-family: Consolas, monospace;
        padding: 2px 9px; border-radius: 10px;
        background: #38bdf822; color: #38bdf8;
    }
    .hqj-panel > p { font-size: 12.5px; color: #8b949e; margin-bottom: 12px; }

    .hqj-canvas-box {
        width: 100%; height: 480px;
        border-radius: 10px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 30%, #1c2533, #0d1117);
    }
    canvas { display: block; }

    .hqj-legend {
        display: flex; gap: 18px; flex-wrap: wrap;
        margin-top: 12px; font-size: 13px; color: #c9d1d9;
    }
    .hqj-legend span { display: flex; align-items: center; gap: 7px; }
    .hqj-legend i {
        width: 12px; height: 12px; border-radius: 3px; display: inline-block;
    }

    .hqj-back {
        display: inline-block; margin-top: 10px;
        color: #8b949e; font-size: 13px; text-decoration: none;
    }
</style>
</head>
<body>
<div class="hqj-wrap">
    <header class="hqj-header">
        <h1>Three.js <span class="hqj-hl">3D 图表</span></h1>
        <p>两个纯 Three.js 搭建的 3D 图表：自动旋转，鼠标按住可拖拽视角，库与数据全部本地化</p>
    </header>

    <div class="hqj-panel">
        <h2>3D 柱状图 <span class="hqj-badge">BoxGeometry · 季度销量</span></h2>
        <p>柱高对应销量，地面网格辅助读数，自动旋转，按住鼠标左右拖动可手动旋转</p>
        <div class="hqj-canvas-box" id="hqj_barBox"></div>
        <div class="hqj-legend" id="hqj_barLegend"></div>
    </div>

    <div class="hqj-panel">
        <h2>3D 饼图 <span class="hqj-badge">ExtrudeGeometry · 流量来源占比</span></h2>
        <p>扇形拉伸成立体饼块，厚度一致，自动旋转，按住鼠标左右拖动可手动旋转</p>
        <div class="hqj-canvas-box" id="hqj_pieBox"></div>
        <div class="hqj-legend" id="hqj_pieLegend"></div>
    </div>

    <a class="hqj-back" href="index.html">← 返回首页</a>
</div>

<script src="cdn/three/three.min.js"></script>
<script>
(function () {
    // 通用：给容器绑定鼠标拖拽旋转
    function hqj_bindDrag(box, group) {
        var dragging = false, lastX = 0;
        box.addEventListener('mousedown', function (e) {
            dragging = true; lastX = e.clientX;
        });
        window.addEventListener('mouseup', function () { dragging = false; });
        window.addEventListener('mousemove', function (e) {
            if (!dragging) return;
            group.rotation.y += (e.clientX - lastX) * 0.01;
            lastX = e.clientX;
        });
        return function () { if (!dragging) group.rotation.y += 0.004; };
    }

    // ============ 图一：3D 柱状图 ============
    (function hqj_barChart() {
        var box = document.getElementById('hqj_barBox');
        var W = box.clientWidth, H = box.clientHeight;

        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1000);
        camera.position.set(14, 11, 16);
        camera.lookAt(0, 3, 0);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(W, H);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        box.appendChild(renderer.domElement);

        var group = new THREE.Group();
        scene.add(group);

        // 灯光
        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        var dir = new THREE.DirectionalLight(0xffffff, 0.9);
        dir.position.set(10, 18, 8);
        scene.add(dir);

        // 地面网格
        var grid = new THREE.GridHelper(24, 24, 0x3b4a63, 0x222c3c);
        grid.position.y = 0;
        group.add(grid);

        // 数据
        var data = [
            { label: '一季度', value: 6, color: 0x38bdf8 },
            { label: '二季度', value: 9, color: 0x34d399 },
            { label: '三季度', value: 7, color: 0xfbbf24 },
            { label: '四季度', value: 12, color: 0xf472b6 },
            { label: '次年Q1', value: 10, color: 0xa78bfa },
            { label: '次年Q2', value: 14, color: 0xfb7185 }
        ];
        var barW = 1.3, gap = 2.6;
        var startX = -((data.length - 1) * gap) / 2;

        data.forEach(function (d, i) {
            var h = d.value;
            var geo = new THREE.BoxGeometry(barW, h, barW);
            var mat = new THREE.MeshLambertMaterial({ color: d.color });
            var bar = new THREE.Mesh(geo, mat);
            bar.position.set(startX + i * gap, h / 2, 0);
            group.add(bar);

            // 线框
            var edges = new THREE.EdgesGeometry(geo);
            var line = new THREE.LineSegments(edges,
                new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 }));
            line.position.copy(bar.position);
            group.add(line);
        });

        // HTML 图例
        var legend = document.getElementById('hqj_barLegend');
        data.forEach(function (d) {
            var s = document.createElement('span');
            s.innerHTML = '<i style="background:#' + d.color.toString(16).padStart(6, '0') + '"></i>'
                + d.label + '：' + d.value + ' 万件';
            legend.appendChild(s);
        });

        var auto = hqj_bindDrag(box, group);
        function loop() {
            requestAnimationFrame(loop);
            auto();
            renderer.render(scene, camera);
        }
        loop();

        window.addEventListener('resize', function () {
            camera.aspect = box.clientWidth / box.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(box.clientWidth, box.clientHeight);
        });
    })();

    // ============ 图二：3D 饼图 ============
    (function hqj_pieChart() {
        var box = document.getElementById('hqj_pieBox');
        var W = box.clientWidth, H = box.clientHeight;

        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1000);
        camera.position.set(0, 9, 14);
        camera.lookAt(0, 0, 0);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(W, H);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        box.appendChild(renderer.domElement);

        var group = new THREE.Group();
        scene.add(group);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var dir = new THREE.DirectionalLight(0xffffff, 0.85);
        dir.position.set(8, 14, 6);
        scene.add(dir);

        var data = [
            { label: '直接访问', value: 32, color: 0x38bdf8 },
            { label: '搜索引擎', value: 28, color: 0x34d399 },
            { label: '社交媒体', value: 18, color: 0xfbbf24 },
            { label: '外部链接', value: 14, color: 0xf472b6 },
            { label: '邮件营销', value: 8, color: 0xa78bfa }
        ];
        var radius = 6, height = 1.4;
        var total = data.reduce(function (s, d) { return s + d.value; }, 0);
        var angle = 0;

        data.forEach(function (d) {
            var span = d.value / total * Math.PI * 2;
            var shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.absarc(0, 0, radius, angle, angle + span, false);
            shape.lineTo(0, 0);

            var geo = new THREE.ExtrudeGeometry(shape, {
                depth: height, bevelEnabled: false
            });
            var mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: d.color }));
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = height / 2;
            group.add(mesh);

            angle += span;
        });

        var legend = document.getElementById('hqj_pieLegend');
        data.forEach(function (d) {
            var s = document.createElement('span');
            s.innerHTML = '<i style="background:#' + d.color.toString(16).padStart(6, '0') + '"></i>'
                + d.label + '：' + d.value + '%';
            legend.appendChild(s);
        });

        var auto = hqj_bindDrag(box, group);
        function loop() {
            requestAnimationFrame(loop);
            auto();
            renderer.render(scene, camera);
        }
        loop();

        window.addEventListener('resize', function () {
            camera.aspect = box.clientWidth / box.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(box.clientWidth, box.clientHeight);
        });
    })();
})();
</script>
</body>
</html>
