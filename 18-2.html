<!DOCTYPE html>
<!-- 何秦剑  建立时间：2026-11-05  大模型：GPT-6-luna  功能：基于 Canvas 绘制电商系统全栈架构图，含分层模块与动态数据流 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas 电商全栈架构图 | 18-2 何秦剑</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #f1f5f9;
        font-family: "Microsoft YaHei", sans-serif;
    }
    .hqj-wrap { max-width: 1240px; margin: 0 auto; padding: 26px 14px 50px; }
    .hqj-header { text-align: center; margin-bottom: 18px; }
    .hqj-header h1 { font-size: 25px; margin-bottom: 6px; }
    .hqj-header p { color: #64748b; font-size: 13.5px; }
    .hqj-canvas-box {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 14px;
        overflow-x: auto;
    }
    canvas { display: block; width: 100%; min-width: 900px; }
    .hqj-legend {
        display: flex; gap: 22px; justify-content: center;
        margin-top: 14px; font-size: 13px; color: #475569; flex-wrap: wrap;
    }
    .hqj-dot {
        display: inline-block; width: 10px; height: 10px;
        border-radius: 50%; margin-right: 6px; vertical-align: middle;
    }
    .hqj-back {
        display: inline-block; margin-top: 18px;
        color: #64748b; font-size: 13px; text-decoration: none;
    }
</style>
</head>
<body>
<div class="hqj-wrap">
    <header class="hqj-header">
        <h1>电商系统全栈架构图</h1>
        <p>Canvas 绘制：五层架构，流动光点表示请求与数据在各层之间流转</p>
    </header>

    <div class="hqj-canvas-box">
        <canvas id="hqj_canvas" width="1200" height="960"></canvas>
    </div>

    <div class="hqj-legend">
        <span><i class="hqj-dot" style="background:#0ea5e9"></i>请求/响应数据流</span>
        <span><i class="hqj-dot" style="background:#f59e0b"></i>异步消息</span>
        <span><i class="hqj-dot" style="background:#8b5cf6"></i>数据读写</span>
    </div>
    <a class="hqj-back" href="index.html">← 返回首页</a>
</div>

<script>
(function () {
    var canvas = document.getElementById('hqj_canvas');
    var ctx = canvas.getContext('2d');

    // 每层定义：标题、颜色、模块名
    var layers = [
        { name: '① 用户接入层', color: '#3b82f6', items: ['Web 浏览器', '移动 APP', '小程序', 'H5 / 第三方'] },
        { name: '② 接入层', color: '#06b6d4', items: ['CDN 加速', '负载均衡 SLB', 'API 网关', 'WAF 防火墙'] },
        { name: '③ 应用服务层（微服务）', color: '#10b981', items: ['用户服务', '商品服务', '订单服务', '支付服务', '库存服务', '搜索服务', '营销服务', '物流服务'] },
        { name: '④ 中间件层', color: '#f59e0b', items: ['消息队列 MQ', '分布式缓存', '注册中心', '配置中心'] },
        { name: '⑤ 数据层', color: '#8b5cf6', items: ['MySQL 集群', 'Redis', 'Elasticsearch', '对象存储 OSS', '数据仓库'] }
    ];

    var padX = 40, top = 30, layerH = 150, gap = 26;
    var boxRects = []; // 记录每个模块的矩形，供连线使用
    var layerBands = [];

    function hqj_roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function hqj_draw() {
        boxRects = [];
        layerBands = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (var li = 0; li < layers.length; li++) {
            var layer = layers[li];
            var y = top + li * (layerH + gap);
            layerBands.push({ y: y, h: layerH });

            // 层背景条
            ctx.fillStyle = layer.color + '12';
            ctx.strokeStyle = layer.color + '55';
            ctx.lineWidth = 1.5;
            hqj_roundRect(padX, y, canvas.width - padX * 2, layerH, 12);
            ctx.fill(); ctx.stroke();

            // 层标题
            ctx.fillStyle = layer.color;
            ctx.font = 'bold 17px "Microsoft YaHei"';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(layer.name, padX + 16, y + 12);

            // 模块盒子
            var items = layer.items;
            var innerW = canvas.width - padX * 2 - 32;
            var boxGap = 14;
            var boxW = (innerW - boxGap * (items.length - 1)) / items.length;
            var boxH = 62;
            var boxY = y + 52;

            for (var j = 0; j < items.length; j++) {
                var bx = padX + 16 + j * (boxW + boxGap);
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = layer.color;
                ctx.lineWidth = 2;
                hqj_roundRect(bx, boxY, boxW, boxH, 9);
                ctx.fill(); ctx.stroke();

                ctx.fillStyle = '#1e293b';
                ctx.font = '15px "Microsoft YaHei"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(items[j], bx + boxW / 2, boxY + boxH / 2);

                boxRects.push({ x: bx, y: boxY, w: boxW, h: boxH, layer: li });
            }
        }
    }

    // 流动光点：在相邻层之间沿垂直方向移动
    var packets = [];
    function hqj_spawn() {
        var fromLayer = Math.floor(Math.random() * (layers.length - 1));
        var fromBoxes = boxRects.filter(function (b) { return b.layer === fromLayer; });
        var toBoxes = boxRects.filter(function (b) { return b.layer === fromLayer + 1; });
        var a = fromBoxes[Math.floor(Math.random() * fromBoxes.length)];
        var b = toBoxes[Math.floor(Math.random() * toBoxes.length)];
        var colors = ['#0ea5e9', '#f59e0b', '#8b5cf6'];
        packets.push({
            sx: a.x + a.w / 2, sy: a.y + a.h,
            ex: b.x + b.w / 2, ey: b.y,
            t: 0,
            speed: 0.008 + Math.random() * 0.01,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }

    function hqj_drawPackets() {
        for (var i = packets.length - 1; i >= 0; i--) {
            var p = packets[i];
            p.t += p.speed;
            if (p.t >= 1) { packets.splice(i, 1); continue; }

            var x = p.sx + (p.ex - p.sx) * p.t;
            var y = p.sy + (p.ey - p.sy) * p.t;

            ctx.strokeStyle = p.color + '33';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.sx, p.sy);
            ctx.lineTo(p.ex, p.ey);
            ctx.stroke();

            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function hqj_loop() {
        hqj_draw();
        if (Math.random() < 0.35 && packets.length < 40) hqj_spawn();
        hqj_drawPackets();
        requestAnimationFrame(hqj_loop);
    }

    hqj_loop();
})();
</script>
</body>
</html>
