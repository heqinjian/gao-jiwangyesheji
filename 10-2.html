<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation 幻灯片 | 何秦剑</title>
    <style>
        :root {
            --ink: #f7f2ea;
            --muted: #c9c2b8;
            --accent: #f4b860;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--ink);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #171411;
        }

        .page {
            width: min(100%, 1000px);
            padding: 32px 20px;
        }

        .intro {
            margin-bottom: 22px;
            animation: rise-in 900ms ease both;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 12px;
            letter-spacing: 4px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 54px);
            line-height: 1.1;
        }

        .intro p {
            max-width: 560px;
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .slider {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: #302820;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
            animation: color-cycle 12s infinite alternate ease-in-out;
        }

        .track {
            width: 300%;
            height: 100%;
            display: flex;
            animation: slide 12s infinite steps(1, end);
        }

        .slide {
            position: relative;
            width: 33.333333%;
            flex: 0 0 33.333333%;
            overflow: hidden;
        }

        .slide img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            filter: saturate(0.9) contrast(1.04);
            animation: image-drift 12s infinite ease-in-out;
        }

        .caption {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 22px 24px 20px;
            background: rgba(0, 0, 0, 0.62);
        }

        .caption strong {
            display: block;
            font-size: clamp(20px, 3vw, 32px);
        }

        .caption span {
            display: block;
            margin-top: 5px;
            color: #ddd5ca;
            font-size: 13px;
        }

        .dots {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .dots i {
            width: 34px;
            height: 4px;
            display: block;
            background: rgba(255, 255, 255, 0.28);
            animation: dot-light 12s infinite steps(1, end);
        }

        .dots i:nth-child(2) {
            animation-delay: 4s;
        }

        .dots i:nth-child(3) {
            animation-delay: 8s;
        }

        @keyframes slide {
            0%, 30% { transform: translateX(0); }
            33%, 63% { transform: translateX(-33.333333%); }
            66%, 96% { transform: translateX(-66.666666%); }
            100% { transform: translateX(0); }
        }

        @keyframes color-cycle {
            0%, 24% { background: #302820; }
            25%, 49% { background: #243a3a; }
            50%, 74% { background: #3d2937; }
            75%, 100% { background: #29353d; }
        }

        @keyframes image-drift {
            0%, 30% { transform: scale(1.04) translateX(0); }
            33%, 63% { transform: scale(1.04) translateX(-2%); }
            66%, 96% { transform: scale(1.04) translateX(2%); }
            100% { transform: scale(1.04) translateX(0); }
        }

        @keyframes dot-light {
            0%, 30% { background: var(--accent); }
            33%, 100% { background: rgba(255, 255, 255, 0.28); }
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .intro, .slider, .track, .slide img, .dots i {
                animation-play-state: paused;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="intro">
            <p class="eyebrow">CSS ANIMATION / 10-2</p>
            <h1>图片在移动，故事在切换</h1>
            <p>何秦剑 · 纯 CSS 幻灯片实验。图片通过位置动画完成切换，不使用透明度渐变。</p>
        </header>

        <section class="slider" aria-label="自动播放的图片幻灯片">
            <div class="track">
                <article class="slide">
                    <img src="image1.jpg" alt="第一张幻灯片图片">
                    <div class="caption"><strong>第一帧 · 观察</strong><span>让画面从一个稳定的位置开始。</span></div>
                </article>
                <article class="slide">
                    <img src="image2.jpg" alt="第二张幻灯片图片">
                    <div class="caption"><strong>第二帧 · 行走</strong><span>通过水平位移进入下一段内容。</span></div>
                </article>
                <article class="slide">
                    <img src="image3.jpg" alt="第三张幻灯片图片">
                    <div class="caption"><strong>第三帧 · 抵达</strong><span>黑底白字让文字始终清晰可读。</span></div>
                </article>
            </div>
        </section>
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </main>
</body>
</html>
