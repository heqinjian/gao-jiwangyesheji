<!DOCTYPE html>
<!-- 何秦剑  建立时间：2026-11-05  大模型：GPT-6-luna  功能：基于 ECharts 的三列数据大屏（中间上方为中国地图，库与地图数据全部本地化于 cdn/echarts） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据大屏 | 18-8 何秦剑</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background: #060d1f;
        color: #cfe3ff;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        overflow: hidden;
    }
    .hqj-screen {
        display: flex; flex-direction: column;
        height: 100vh; min-width: 1100px;
        padding: 0 14px 12px;
    }

    /* 顶部标题 */
    .hqj-top {
        height: 64px; flex: none;
        display: flex; align-items: center; justify-content: space-between;
        background: linear-gradient(180deg, rgba(20,60,120,.55), transparent);
        padding: 0 18px;
    }
    .hqj-top h1 {
        font-size: 26px; letter-spacing: 6px;
        background: linear-gradient(180deg, #fff, #59b7ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 24px rgba(56,189,248,.45);
    }
    .hqj-top .hqj-side {
        font-family: Consolas, monospace; font-size: 13px;
        color: #7fb2e8; width: 280px;
    }
    .hqj-top .hqj-side:last-child { text-align: right; }

    /* 主体三列 */
    .hqj-main {
        flex: 1;
        display: grid;
        grid-template-columns: 24% 1fr 24%;
        gap: 12px;
        min-height: 0;
    }
    .hqj-col {
        display: flex; flex-direction: column;
        gap: 12px;
        min-height: 0;
    }

    .hqj-panel {
        position: relative;
        background: linear-gradient(180deg, rgba(16,42,82,.75), rgba(10,24,52,.85));
        border: 1px solid #1d4f8f;
        border-radius: 6px;
        padding: 12px 12px 8px;
        display: flex; flex-direction: column;
        min-height: 0;
    }
    .hqj-panel::before, .hqj-panel::after {
        content: ""; position: absolute;
        width: 12px; height: 12px;
        border: 2px solid #38bdf8;
    }
    .hqj-panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .hqj-panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    .hqj-panel h2 {
        flex: none;
        font-size: 14px; font-weight: 700;
        color: #8fd0ff; letter-spacing: 2px;
        margin-bottom: 6px;
        padding-left: 10px;
        position: relative;
    }
    .hqj-panel h2::before {
        content: ""; position: absolute; left: 0; top: 3px;
        width: 3px; height: 13px; background: #38bdf8;
    }
    .hqj-chart { flex: 1; min-height: 0; }

    .hqj-col .hqj-panel { flex: 1; }
    .hqj-mid .hqj-panel.hqj-map-panel { flex: 1.25; }
    .hqj-mid .hqj-panel.hqj-trend-panel { flex: 1; }
</style>
</head>
<body>
<div class="hqj-screen">
    <header class="hqj-top">
        <div class="hqj-side" id="hqj_week"></div>
        <h1>全国电商运营数据大屏</h1>
        <div class="hqj-side" id="hqj_clock"></div>
    </header>

    <div class="hqj-main">
        <!-- 左列 -->
        <div class="hqj-col">
            <div class="hqj-panel">
                <h2>品类销售额（万元）</h2>
                <div class="hqj-chart" id="hqj_c1"></div>
            </div>
            <div class="hqj-panel">
                <h2>销售渠道占比</h2>
                <div class="hqj-chart" id="hqj_c2"></div>
            </div>
            <div class="hqj-panel">
                <h2>城市销售 TOP5</h2>
                <div class="hqj-chart" id="hqj_c3"></div>
            </div>
        </div>

        <!-- 中列 -->
        <div class="hqj-col hqj-mid">
            <div class="hqj-panel hqj-map-panel">
                <h2>全国业务分布（城市节点）</h2>
                <div class="hqj-chart" id="hqj_map"></div>
            </div>
            <div class="hqj-panel hqj-trend-panel">
                <h2>近 12 个月订单量与转化率</h2>
                <div class="hqj-chart" id="hqj_c4"></div>
            </div>
        </div>

        <!-- 右列 -->
        <div class="hqj-col">
            <div class="hqj-panel">
                <h2>实时访问流量（动态刷新）</h2>
                <div class="hqj-chart" id="hqj_c5"></div>
            </div>
            <div class="hqj-panel">
                <h2>年度目标完成率</h2>
                <div class="hqj-chart" id="hqj_c6"></div>
            </div>
            <div class="hqj-panel">
                <h2>综合运营能力评估</h2>
                <div class="hqj-chart" id="hqj_c7"></div>
            </div>
        </div>
    </div>
</div>

<script src="cdn/echarts/echarts.min.js"></script>
<script>
(function () {
    var charts = [];
    function mk(id) {
        var c = echarts.init(document.getElementById(id));
        charts.push(c);
        return c;
    }

    var axisStyle = {
        axisLine: { lineStyle: { color: '#2f5c92' } },
        axisLabel: { color: '#8fb4dd', fontSize: 11 },
        splitLine: { lineStyle: { color: 'rgba(47,92,146,.35)' } }
    };

    // 左1：品类柱状
    mk('hqj_c1').setOption({
        grid: { left: 42, right: 14, top: 18, bottom: 26 },
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: ['数码','服饰','食品','家电','美妆','图书'], axisLine: axisStyle.axisLine, axisLabel: axisStyle.axisLabel },
        yAxis: { type: 'value', axisLine: axisStyle.axisLine, axisLabel: axisStyle.axisLabel, splitLine: axisStyle.splitLine },
        series: [{
            type: 'bar', barWidth: '52%',
            data: [320, 260, 210, 180, 150, 90],
            itemStyle: {
                borderRadius: [3, 3, 0, 0],
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#38bdf8' }, { offset: 1, color: '#0b4fa0' }
                ])
            }
        }]
    });

    // 左2：渠道饼图
    mk('hqj_c2').setOption({
        tooltip: { trigger: 'item' },
        legend: { bottom: 0, textStyle: { color: '#8fb4dd', fontSize: 11 } },
        series: [{
            type: 'pie', radius: ['42%', '66%'], center: ['50%', '44%'],
            label: { color: '#cfe3ff', fontSize: 11 },
            data: [
                { value: 46, name: '自营商城' },
                { value: 28, name: '天猫' },
                { value: 16, name: '京东' },
                { value: 10, name: '直播带货' }
            ]
        }]
    });

    // 左3：横向条形排行
    mk('hqj_c3').setOption({
        grid: { left: 56, right: 26, top: 14, bottom: 20 },
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'value', axisLine: axisStyle.axisLine, axisLabel: axisStyle.axisLabel, splitLine: axisStyle.splitLine },
        yAxis: { type: 'category', data: ['深圳','广州','北京','杭州','上海'], axisLine: axisStyle.axisLine, axisLabel: axisStyle.axisLabel },
        series: [{
            type: 'bar', barWidth: '55%',
            data: [142, 168, 196, 225, 280],
            itemStyle: {
                borderRadius: [0, 3, 3, 0],
                color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                    { offset: 0, color: '#0b4fa0' }, { offset: 1, color: '#34d399' }
                ])
            },
            label: { show: true, position: 'right', color: '#8fd0ff', fontSize: 11 }
        }]
    });

    // 中2：订单+转化率
    var months = ['12月','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月'];
    mk('hqj_c4').setOption({
        grid: { left: 46, right: 46, top: 34, bottom: 26 },
        tooltip: { trigger: 'axis' },
        legend: { top: 2, textStyle: { color: '#8fb4dd', fontSize: 11 } },
        xAxis: { type: 'category', data: months, axisLine: axisStyle.axisLine, axisLabel: axisStyle.axisLabel },
        yAxis: [
            { type: 'value', name: '订单', nameTextStyle: { color: '#8fb4dd' }, axisLine: axisStyle.axisLine, axisLabel: axisStyle.axisLabel, splitLine: axisStyle.splitLine },
            { type: 'value', name: '转化率%', nameTextStyle: { color: '#8fb4dd' }, axisLine: axisStyle.axisLine, axisLabel: axisStyle.axisLabel, splitLine: { show: false } }
        ],
        series: [
            { name: '订单量', type: 'bar', barWidth: '45%', data: [210,260,230,300,340,380,420,460,430,500,560,620],
              itemStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#38bdf8'},{offset:1,color:'#0b4fa0'}]), borderRadius:[3,3,0,0] } },
            { name: '转化率', type: 'line', yAxisIndex: 1, smooth: true, data: [2.1,2.4,2.3,2.8,3.1,3.4,3.6,3.9,3.7,4.2,4.6,5.1],
              lineStyle: { color: '#fbbf24', width: 2 }, itemStyle: { color: '#fbbf24' } }
        ]
    });

    // 右1：实时流量折线
    var live = mk('hqj_c5');
    var liveData = [];
    for (var i = 0; i < 20; i++) liveData.push(Math.round(200 + Math.random() * 160));
    live.setOption({
        grid: { left: 40, right: 14, top: 18, bottom: 24 },
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: liveData.map(function (_, k) { return k; }), show: false },
        yAxis: { type: 'value', axisLine: axisStyle.axisLine, axisLabel: axisStyle.axisLabel, splitLine: axisStyle.splitLine },
        series: [{
            type: 'line', smooth: true, showSymbol: false, data: liveData,
            lineStyle: { color: '#34d399', width: 2 },
            areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(52,211,153,.45)'},{offset:1,color:'rgba(52,211,153,0)'}]) }
        }]
    });
    setInterval(function () {
        liveData.shift();
        liveData.push(Math.round(200 + Math.random() * 160));
        live.setOption({ series: [{ data: liveData }] });
    }, 1500);

    // 右2：仪表盘
    mk('hqj_c6').setOption({
        series: [{
            type: 'gauge', radius: '88%', center: ['50%', '58%'],
            progress: { show: true, width: 10 },
            axisLine: { lineStyle: { width: 10, color: [[0.3, '#ef4444'], [0.7, '#fbbf24'], [1, '#34d399']] } },
            axisTick: { show: false }, splitLine: { length: 8, lineStyle: { color: '#8fb4dd' } },
            axisLabel: { color: '#8fb4dd', fontSize: 10, distance: 14 },
            pointer: { width: 4 },
            detail: { valueAnimation: true, color: '#8fd0ff', fontSize: 20, formatter: '{value}%', offsetCenter: [0, '70%'] },
            data: [{ value: 76 }]
        }]
    });

    // 右3：雷达图
    mk('hqj_c7').setOption({
        radar: {
            indicator: [
                { name: '流量', max: 100 }, { name: '转化', max: 100 },
                { name: '客单价', max: 100 }, { name: '复购', max: 100 },
                { name: '物流', max: 100 }, { name: '服务', max: 100 }
            ],
            radius: '62%', center: ['50%', '52%'],
            axisName: { color: '#8fb4dd', fontSize: 11 },
            splitLine: { lineStyle: { color: 'rgba(47,92,146,.6)' } },
            splitArea: { areaStyle: { color: ['rgba(56,189,248,.05)', 'rgba(56,189,248,.12)'] } },
            axisLine: { lineStyle: { color: 'rgba(47,92,146,.6)' } }
        },
        series: [{
            type: 'radar',
            data: [{ value: [88, 72, 65, 80, 76, 84], name: '本期评估' }],
            areaStyle: { color: 'rgba(56,189,248,.35)' },
            lineStyle: { color: '#38bdf8' },
            itemStyle: { color: '#38bdf8' }
        }]
    });

    // 中1：中国地图（先注册再初始化内容）
    var mapChart = mk('hqj_map');
    fetch('cdn/echarts/china.json')
        .then(function (r) { return r.json(); })
        .then(function (geo) {
            echarts.registerMap('china', geo);
            var points = [
                { name: '北京', value: [116.40, 39.90, 95] },
                { name: '上海', value: [121.47, 31.23, 98] },
                { name: '广州', value: [113.26, 23.13, 86] },
                { name: '深圳', value: [114.06, 22.54, 90] },
                { name: '杭州', value: [120.15, 30.27, 78] },
                { name: '成都', value: [104.07, 30.67, 70] },
                { name: '西安', value: [108.94, 34.34, 62] },
                { name: '武汉', value: [114.30, 30.59, 66] },
                { name: '大连', value: [121.62, 38.92, 58] },
                { name: '乌鲁木齐', value: [87.62, 43.83, 44] }
            ];
            mapChart.setOption({
                tooltip: { trigger: 'item', formatter: function (p) { return p.name ? p.name + ' 指数 ' + (p.value[2] || '') : ''; } },
                geo: {
                    map: 'china', roam: true,
                    zoom: 1.15,
                    itemStyle: { areaColor: 'rgba(16,60,120,.55)', borderColor: '#38bdf8', borderWidth: 1 },
                    emphasis: { itemStyle: { areaColor: 'rgba(56,189,248,.35)' }, label: { color: '#fff' } }
                },
                series: [
                    {
                        name: '城市指数', type: 'effectScatter', coordinateSystem: 'geo',
                        data: points, symbolSize: function (v) { return 5 + v[2] / 12; },
                        rippleEffect: { brushType: 'stroke', scale: 3 },
                        itemStyle: { color: '#fbbf24' },
                        label: { show: true, formatter: '{b}', position: 'right', color: '#cfe3ff', fontSize: 10 }
                    },
                    {
                        type: 'scatter', coordinateSystem: 'geo',
                        data: points.map(function (p) { return { name: p.name, value: p.value }; }),
                        symbolSize: 4, itemStyle: { color: '#f472b6' }
                    }
                ]
            });
        });

    // 顶部时钟
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function tick() {
        var d = new Date();
        document.getElementById('hqj_clock').textContent =
            d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
            pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        document.getElementById('hqj_week').textContent = '星期' + ['日','一','二','三','四','五','六'][d.getDay()];
    }
    tick(); setInterval(tick, 1000);

    window.addEventListener('resize', function () {
        charts.forEach(function (c) { c.resize(); });
    });
})();
</script>
</body>
</html>
