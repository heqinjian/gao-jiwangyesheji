<!DOCTYPE html>
<!-- 何秦剑  建立时间：2026-11-05  大模型：GPT-6-luna  功能：Canvas 粒子动画——粒子汇聚成“何秦剑”文字，鼠标扰动后自动归位 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas 粒子文字 | 18-1 何秦剑</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0a0e1a;
        font-family: "Microsoft YaHei", sans-serif;
        overflow: hidden;
    }
    #hqj_canvas { display: block; }
    .hqj-tip {
        position: fixed;
        top: 18px; left: 50%;
        transform: translateX(-50%);
        color: #8fa3c8;
        font-size: 13px;
        letter-spacing: 1px;
        pointer-events: none;
    }
    .hqj-back {
        position: fixed;
        bottom: 16px; left: 18px;
        color: #5b6b8c;
        font-size: 13px;
        text-decoration: none;
    }
</style>
</head>
<body>
<p class="hqj-tip">移动鼠标可扰动粒子，松开后自动重新汇聚成「何秦剑」</p>
<canvas id="hqj_canvas"></canvas>
<a class="hqj-back" href="index.html">← 返回首页</a>

<script>
(function () {
    var canvas = document.getElementById('hqj_canvas');
    var ctx = canvas.getContext('2d');
    var W, H;
    var particles = [];
    var mouse = { x: -9999, y: -9999, radius: 90 };

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        hqj_build();
    }

    // 离屏画布绘制文字，再按像素采样生成粒子
    function hqj_build() {
        particles = [];
        var off = document.createElement('canvas');
        off.width = W; off.height = H;
        var octx = off.getContext('2d');

        var fontSize = Math.min(W / 5.2, 190);
        octx.fillStyle = '#fff';
        octx.font = 'bold ' + fontSize + 'px "Microsoft YaHei", sans-serif';
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillText('何秦剑', W / 2, H / 2);

        var img = octx.getImageData(0, 0, W, H).data;
        var gap = 4; // 采样间隔，越小粒子越密
        for (var y = 0; y < H; y += gap) {
            for (var x = 0; x < W; x += gap) {
                var idx = (y * W + x) * 4;
                if (img[idx + 3] > 128) {
                    particles.push({
                        tx: x, ty: y,                       // 目标位置
                        x: Math.random() * W,               // 初始随机位置
                        y: Math.random() * H,
                        vx: 0, vy: 0,
                        size: Math.random() * 1.6 + 0.8,
                        hue: 160 + Math.random() * 60       // 青绿色系
                    });
                }
            }
        }
    }

    function hqj_animate() {
        ctx.fillStyle = 'rgba(10, 14, 26, 0.28)';
        ctx.fillRect(0, 0, W, H);

        for (var i = 0; i < particles.length; i++) {
            var p = particles[i];

            // 鼠标排斥
            var dx = p.x - mouse.x;
            var dy = p.y - mouse.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < mouse.radius) {
                var force = (mouse.radius - dist) / mouse.radius;
                p.vx += (dx / dist) * force * 2.2;
                p.vy += (dy / dist) * force * 2.2;
            }

            // 弹簧回归目标点
            p.vx += (p.tx - p.x) * 0.045;
            p.vy += (p.ty - p.y) * 0.045;
            p.vx *= 0.86;
            p.vy *= 0.86;
            p.x += p.vx;
            p.y += p.vy;

            ctx.fillStyle = 'hsl(' + p.hue + ', 85%, 62%)';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        requestAnimationFrame(hqj_animate);
    }

    window.addEventListener('mousemove', function (e) {
        mouse.x = e.clientX; mouse.y = e.clientY;
    });
    window.addEventListener('mouseout', function () {
        mouse.x = -9999; mouse.y = -9999;
    });
    window.addEventListener('resize', resize);

    resize();
    hqj_animate();
})();
</script>
</body>
</html>
